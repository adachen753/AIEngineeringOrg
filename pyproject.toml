[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-engineering-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "langgraph==0.4.8", "pydantic==2.11.5", "httpx==0.28.1", "streamlit==1.45.1", "portalocker==3.1.1"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
[project.scripts]
aim = "ai_manager.cli:main"
[tool.setuptools.packages.find]
include = ["ai_manager*"]
[tool.setuptools.package-data]
ai_manager = ["roles/*.json", "roles/*/*.md"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
